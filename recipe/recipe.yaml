# copied from https://github.com/bioconda/bioconda-recipes/blob/9c08a16bac9b7d0a076578823d5008b8bbfc466e/recipes/toil/meta.yaml
schema_version: 1

context:
  name: toil
  version: "9.6.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/${{ name }}-${{ version }}.tar.gz
  sha256: 5469d45e06e65d6ffadfc22918952460f80da4611ec5318a5de62b6192db2f16
  patches:
    - 0001-Avoid-AssertionError-Could-not-determine-AWS-availab.patch
    - 0002-work-around-missing-stubserver.patch
    - 0003-ToilCommandLineTool-fix-inits.patch
    - 0004-count_cpu-support-cgroups-v2-default-maximum-bandwid.patch
    - 0005-Missing-needs_docker.patch

build:
  number: 0
  noarch: python
  script: |
    sed -i "s/python = 'python3.*'/python = 'python3'/g" src/toil/version.py
    sed -i "s/exactPython = 'python3.*'/exactPython = 'python3'/g" src/toil/version.py
    sed -i "s/cwltool_version = '.*'/cwltool_version = '3.3.20260925135507'/g" src/toil/version.py
    ${{ PYTHON }} -m pip install . --no-deps --no-build-isolation --no-cache-dir -vvv
  python:
    entry_points:
      - toil = toil.utils.toilMain:main
      - _toil_worker = toil.worker:main
      - toil-cwl-runner = toil.cwl.cwltoil:main
      - toil-wdl-runner = toil.wdl.wdltoil:main
      - toil-wes-cwl-runner = toil.server.cli.wes_cwl_runner:main
      - _toil_mesos_executor = toil.batchSystems.mesos.executor:main
      - _toil_contained_executor = toil.batchSystems.contained_executor:executor

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=65.5.1,<83
    - wheel
  run:
    - python >=${{ python_min }}
    - dill >=0.3.2,<0.5
    - requests >2,<=2.33.1
    - docker-py >=6.1.0,<8
    - urllib3 >=1.26.0,<3
    - python-dateutil
    - psutil >=6.1.0,<8
    - pypubsub >=4.0.3,<5
    - addict >=2.2.1,<2.5
    - enlighten >=1.5.2,<2
    - configargparse >=1.7,<2
    - ruamel.yaml >=0.15
    - pyyaml >=6,<7
    - typing-extensions >=4.6.2,<5
    - coloredlogs >=15,<16
    - prompt_toolkit >=3.0,<4
    #mesos pymesos isn't available
    #server reqs
    # - wes-service is missing
    # so commenting out the remaining server reqs for now
    # - connexion >=2.10.0, <4
    # - flask >=2.0,<4
    # - werkzeug >=2.0,<4
    # - flask-cors ==5.0.0
    # - gunicorn ==23.0.0
    # - celery >=5.1.0, <6
    #aws reqs
    # mypy-boto3-iam & ec2_metadata are not yet in Conda
    - boto3-stubs >=1.28.3.post2,<2
    # - mypy-boto3-iam >=1.28.3.post2,<2
    - mypy-boto3-s3 >=1.28.3.post3,<2
    - moto >=5.0.3,<6
    # - ec2_metadata <3
    #encryption reqs
    - pynacl >=1.4.0,<2
    #google reqs
    - apache-libcloud >=3.6.1,<4
    - google-cloud-storage >=2,<=2.8.0
    - google-auth >=2.18.1,<3
    #cwl reqs
    - cwltool ==3.3.20260925135507
    - schema-salad >=8.4.20230128170514,<9
    - galaxy-tool-util <27
    - ruamel.yaml >=0.15,<=0.19.1
    - ruamel.yaml.clib >=0.2.6
    - networkx <4
    - cachecontrol-with-filecache
    - cwl-utils >=0.41
    #htcondor reqs
    - python-htcondor >=23.6.0,<25
    #kubernetes reqs
    - python-kubernetes >=12.0.1,<36
    - idna >=2
    #wdl reqs
    - miniwdl ==1.13.1
    # - wdlparse ==0.1.0

tests:
  - python:
      imports:
        - toil
        - toil.batchSystems
        - toil.cwl
        - toil.fileStores
        - toil.jobStores
        - toil.jobStores.aws
        - toil.lib
        - toil.lib.encryption
        - toil.provisioners
        - toil.provisioners.aws
        - toil.server
        - toil.server.api_spec
        - toil.server.cli
        - toil.server.wes
        - toil.utils
        - toil.wdl
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"
  - requirements:
      run:
        - pip
        - python ${{ python_min }}.*
        - pytest >=9,<10
        - pytest-xdist
        - pytest-timeout >=1.4.2,<3
        - pytest-httpserver >=1.1.3,<2
        - cwltest >=2.7.20260814150058
        - rsync
        - nodejs
        - edit_distance
        - util-linux  # for the "rev" command
    files:
      source:
        - setup.cfg
    script:
      env:
        TOIL_SKIP_ONLINE: "true"
        TOIL_TEST_QUICK: "true"
        TOIL_SKIP_DOCKER: "true"
        TOIL_HISTORY: "0"
        slow_tests: "or test_url_to_optional_file or test_rm_tmpdir or testImportReadFileCompatibility or testPromises2 or testServices or testJobDeletions or testDynamic or testSimultaneousReadsUncachedStream or testServiceWithCheckpoints"
      content: |
        toil --help
        _toil_worker --help
        toil-cwl-runner --help
        pytest -n auto --dist worksteal --durations=10 -k "not (testVirtualEnv or testBuiltIn or test_retrieve_task_directory ${slow_tests})" --pyargs toil.test
        # testVirtualEnv: the Toil Conda package is not installed as a VirtualEnv
        # testBuiltIn: tests are not run from a source checkout
        # test_retrieve_task_directory: unknown failure reason

about:
  summary: A scalable, efficient, cross-platform and easy-to-use workflow engine in pure Python
  license: Apache-2.0
  license_file: LICENSE
  homepage: https://toil.ucsc-cgl.org/
  repository: https://github.com/DataBiosphere/toil
  documentation: https://toil.readthedocs.io/en/latest/

extra:
  recipe-maintainers:
    - sameeul
    - mr-c
